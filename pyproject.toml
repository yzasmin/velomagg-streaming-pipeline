[project]
name = "velomagg-pipeline"
version = "0.1.0"
description = "Pipeline streaming des disponibilités Vélomagg (GBFS) : Redpanda, PostgreSQL, dbt, Grafana"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "confluent-kafka>=2.5,<3",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/velomagg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

# Règles fixées explicitement pour que la CI et le poste local donnent le même verdict.
[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
